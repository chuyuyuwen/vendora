<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Vendora 小商店管理系统</title>
    <style>
        .navbar-dark {
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .navbar-dark .navbar-brand {
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .navbar-dark .nav-link {
            font-size: 1rem;
            padding: 0.5rem 1rem;
            border-bottom: 2px solid transparent;
            transition: opacity 0.2s, border-color 0.2s;
        }
        .navbar-dark .nav-link.active {
            opacity: 1;
            border-bottom-color: #ffd700;
        }
        .navbar-dark .nav-link.active i {
            color: #ffd700;
        }
        .navbar-dark .nav-link:not(.active) {
            opacity: 0.6;
        }
        .navbar-dark .nav-link:not(.active):hover {
            opacity: 0.85;
            border-bottom-color: rgba(255,255,255,0.3);
        }
        .navbar-dark .nav-link i {
            font-size: 1.05rem;
        }
    </style>
</head>
<body>
    <nav th:fragment="nav" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">
                <i class="fa-solid fa-shop"></i> Vendora
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto" id="mainNav">
                    <li class="nav-item">
                        <a class="nav-link" href="/"><i class="fa-solid fa-house"></i> 首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/product/list"><i class="fa-solid fa-box"></i> 商品管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/trade"><i class="fa-solid fa-right-left"></i> 交易管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/inventory/list"><i class="fa-solid fa-warehouse"></i> 库存管理</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div th:fragment="messages" class="container">
        <div th:if="${msg}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${msg}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    </div>

    <th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (function() {
            var path = window.location.pathname;
            var links = document.querySelectorAll('#mainNav .nav-link');
            var best = null;
            links.forEach(function(link) {
                var href = link.getAttribute('href');
                if (href && href !== '#' && href !== '/') {
                    if (path.startsWith(href)) {
                        if (!best || href.length > best.getAttribute('href').length) {
                            best = link;
                        }
                    }
                }
            });
            if (path === '/') {
                best = document.querySelector('#mainNav .nav-link[href="/"]');
            }
            if (best) {
                best.classList.add('active');
            }
        })();
    </script>
</th:block>
</body>
</html>
