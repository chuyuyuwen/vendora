<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{common/header :: head}"></th:block>
</head>
<body>
    <th:block th:replace="~{common/header :: nav}"></th:block>

    <div class="container">
        <h3 class="mb-3">库存管理</h3>

        <!-- 搜索栏 -->
        <form class="row g-3 mb-4" th:action="@{/inventory/list}" method="get">
            <div class="col-md-3">
                <input type="text" name="productId" class="form-control" placeholder="商品编号"
                       th:value="${productId}">
            </div>
            <div class="col-md-2">
                <select name="categoryId" class="form-select">
                    <option value="">全部性质</option>
                    <option th:each="c : ${categories}" th:value="${c.id}"
                            th:text="${c.categoryName}"
                            th:selected="${categoryId != null && categoryId == c.id}"></option>
                </select>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-primary">查询</button>
                <a th:href="@{/inventory/list}" class="btn btn-outline-secondary">重置</a>
            </div>
            <div class="col-md-5 text-end">
                <a th:href="@{/inventory/alert}" class="btn btn-warning">低库存预警</a>
            </div>
        </form>

        <table class="table table-striped table-hover">
            <thead class="table-dark">
                <tr>
                    <th>商品编号</th>
                    <th>商品名称</th>
                    <th>商品性质</th>
                    <th>库存数量</th>
                    <th>最后更新时间</th>
                    <th>状态</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="inv : ${inventories}"
                    th:classappend="${inv.quantity < 10} ? 'table-warning'">
                    <td th:text="${inv.product.productId}"></td>
                    <td th:text="${inv.product.productName}"></td>
                    <td th:text="${inv.product.category.categoryName}"></td>
                    <td>
                        <span th:if="${inv.quantity < 10}" class="badge bg-danger" th:text="${inv.quantity}"></span>
                        <span th:unless="${inv.quantity < 10}" th:text="${inv.quantity}"></span>
                    </td>
                    <td th:text="${#temporals.format(inv.updateTime, 'yyyy-MM-dd HH:mm')}"></td>
                    <td>
                        <span th:if="${inv.product.status == 1}" class="badge bg-success">在用</span>
                        <span th:unless="${inv.product.status == 1}" class="badge bg-secondary">停用</span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(inventories)}">
                    <td colspan="6" class="text-center text-muted">暂无库存数据</td>
                </tr>
            </tbody>
        </table>
    </div>

    <th:block th:replace="~{common/header :: scripts}"></th:block>
</body>
</html>
