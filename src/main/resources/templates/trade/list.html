<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{common/header :: head}"></th:block>
    <style>
        .modal.fade .modal-dialog {
            transform: scale(0.85);
            transition: transform 0.25s ease-out, opacity 0.25s ease-out;
            opacity: 0;
        }
        .modal.fade.show .modal-dialog {
            transform: scale(1);
            opacity: 1;
        }
    </style>
</head>
<body>
    <th:block th:replace="~{common/header :: nav}"></th:block>
    <th:block th:replace="~{common/header :: messages}"></th:block>
    <div class="container">
        <ul class="nav nav-tabs mb-4">
            <li class="nav-item">
                <a class="nav-link" th:classappend="${tab == 'purchase'} ? 'active'"
                   th:href="@{/trade(tab='purchase')}">
                    <i class="fa-solid fa-cart-plus"></i> 买入管理
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${tab == 'sale'} ? 'active'"
                   th:href="@{/trade(tab='sale')}">
                    <i class="fa-solid fa-cash-register"></i> 卖出管理
                </a>
            </li>
        </ul>

        <th:block th:if="${tab == 'purchase'}">
            <h4 class="mb-3">买入管理</h4>
            <form class="row g-3 mb-4" th:action="@{/trade}" method="get">
                <input type="hidden" name="tab" value="purchase">
                <div class="col-md-2">
                    <select name="productId" class="form-select">
                        <option value="">全部商品</option>
                        <option th:each="p : ${products}" th:value="${p.productId}"
                                th:text="${p.productId + ' - ' + p.productName}"
                                th:selected="${productId != null && productId == p.productId}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <input type="date" name="startDate" class="form-control" th:value="${startDate}">
                </div>
                <div class="col-md-2">
                    <input type="date" name="endDate" class="form-control" th:value="${endDate}">
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary">查询</button>
                    <a th:href="@{/trade(tab='purchase')}" class="btn btn-outline-secondary">重置</a>
                </div>
                <div class="col-md-4 text-end">
                    <button type="button" class="btn btn-success" onclick="openPurchaseModal()">买入录入</button>
                    <a th:href="@{/purchase/print(startDate=${startDate}, endDate=${endDate})}"
                       class="btn btn-info">汇总打印</a>
                </div>
            </form>
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                    <tr><th>ID</th><th>商品编号</th><th>商品名称</th><th>性质</th><th>进价</th><th>数量</th><th>总金额</th><th>买入日期</th><th>备注</th></tr>
                </thead>
                <tbody>
                    <tr th:each="pr : ${purchasePage.data}">
                        <td th:text="${pr.id}"></td>
                        <td th:text="${pr.product.productId}"></td>
                        <td th:text="${pr.product.productName}"></td>
                        <td th:text="${pr.product.category.categoryName}"></td>
                        <td th:text="${#numbers.formatDecimal(pr.purchasePrice, 0, 'COMMA', 2, 'POINT')}"></td>
                        <td th:text="${pr.quantity}"></td>
                        <td th:text="${#numbers.formatDecimal(pr.totalAmount, 0, 'COMMA', 2, 'POINT')}"></td>
                        <td th:text="${#temporals.format(pr.purchaseDate, 'yyyy-MM-dd')}"></td>
                        <td th:text="${pr.remark}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(purchasePage.data)}">
                        <td colspan="9" class="text-center text-muted">暂无买入记录</td>
                    </tr>
                </tbody>
            </table>
            <div th:if="${purchasePage.totalPages > 0}" class="d-flex justify-content-between align-items-center">
                <span>共 <b th:text="${purchasePage.totalRecords}"></b> 条，第 <b th:text="${purchasePage.currentPage}"></b>/<b th:text="${purchasePage.totalPages}"></b> 页</span>
                <nav><ul class="pagination mb-0">
                    <li class="page-item" th:classappend="${!purchasePage.hasPrevious} ? 'disabled'">
                        <a th:if="${purchasePage.hasPrevious}" class="page-link"
                           th:href="@{/trade(tab='purchase', productId=${productId}, startDate=${startDate}, endDate=${endDate}, pageNo=${purchasePage.previousPage})}">上一页</a>
                        <span th:unless="${purchasePage.hasPrevious}" class="page-link">上一页</span>
                    </li>
                    <li class="page-item" th:classappend="${!purchasePage.hasNext} ? 'disabled'">
                        <a th:if="${purchasePage.hasNext}" class="page-link"
                           th:href="@{/trade(tab='purchase', productId=${productId}, startDate=${startDate}, endDate=${endDate}, pageNo=${purchasePage.nextPage})}">下一页</a>
                        <span th:unless="${purchasePage.hasNext}" class="page-link">下一页</span>
                    </li>
                </ul></nav>
            </div>
        </th:block>

        <th:block th:if="${tab == 'sale'}">
            <h4 class="mb-3">卖出管理</h4>
            <form class="row g-3 mb-4" th:action="@{/trade}" method="get">
                <input type="hidden" name="tab" value="sale">
                <div class="col-md-2">
                    <select name="productId" class="form-select">
                        <option value="">全部商品</option>
                        <option th:each="p : ${products}" th:value="${p.productId}"
                                th:text="${p.productId + ' - ' + p.productName}"
                                th:selected="${productId != null && productId == p.productId}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <input type="date" name="startDate" class="form-control" th:value="${startDate}">
                </div>
                <div class="col-md-2">
                    <input type="date" name="endDate" class="form-control" th:value="${endDate}">
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary">查询</button>
                    <a th:href="@{/trade(tab='sale')}" class="btn btn-outline-secondary">重置</a>
                </div>
                <div class="col-md-4 text-end">
                    <button type="button" class="btn btn-success" onclick="openSaleModal()">卖出录入</button>
                    <a th:href="@{/sale/print(startDate=${startDate}, endDate=${endDate})}"
                       class="btn btn-info">汇总打印</a>
                </div>
            </form>
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                    <tr><th>ID</th><th>商品编号</th><th>商品名称</th><th>性质</th><th>售价</th><th>数量</th><th>总金额</th><th>卖出日期</th><th>备注</th></tr>
                </thead>
                <tbody>
                    <tr th:each="s : ${salePage.data}">
                        <td th:text="${s.id}"></td>
                        <td th:text="${s.product.productId}"></td>
                        <td th:text="${s.product.productName}"></td>
                        <td th:text="${s.product.category.categoryName}"></td>
                        <td th:text="${#numbers.formatDecimal(s.salePrice, 0, 'COMMA', 2, 'POINT')}"></td>
                        <td th:text="${s.quantity}"></td>
                        <td th:text="${#numbers.formatDecimal(s.totalAmount, 0, 'COMMA', 2, 'POINT')}"></td>
                        <td th:text="${#temporals.format(s.saleDate, 'yyyy-MM-dd')}"></td>
                        <td th:text="${s.remark}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(salePage.data)}">
                        <td colspan="9" class="text-center text-muted">暂无卖出记录</td>
                    </tr>
                </tbody>
            </table>
            <div th:if="${salePage.totalPages > 0}" class="d-flex justify-content-between align-items-center">
                <span>共 <b th:text="${salePage.totalRecords}"></b> 条，第 <b th:text="${salePage.currentPage}"></b>/<b th:text="${salePage.totalPages}"></b> 页</span>
                <nav><ul class="pagination mb-0">
                    <li class="page-item" th:classappend="${!salePage.hasPrevious} ? 'disabled'">
                        <a th:if="${salePage.hasPrevious}" class="page-link"
                           th:href="@{/trade(tab='sale', productId=${productId}, startDate=${startDate}, endDate=${endDate}, pageNo=${salePage.previousPage})}">上一页</a>
                        <span th:unless="${salePage.hasPrevious}" class="page-link">上一页</span>
                    </li>
                    <li class="page-item" th:classappend="${!salePage.hasNext} ? 'disabled'">
                        <a th:if="${salePage.hasNext}" class="page-link"
                           th:href="@{/trade(tab='sale', productId=${productId}, startDate=${startDate}, endDate=${endDate}, pageNo=${salePage.nextPage})}">下一页</a>
                        <span th:unless="${salePage.hasNext}" class="page-link">下一页</span>
                    </li>
                </ul></nav>
            </div>
        </th:block>
    </div>

    <!-- ===== 买入录入弹窗 ===== -->
    <div class="modal fade" id="purchaseModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <form th:action="@{/purchase/save}" method="post">
                    <div class="modal-header">
                        <h5 class="modal-title">买入录入</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">商品</label>
                            <select name="product.productId" class="form-select" required>
                                <option value="">-- 请选择商品 --</option>
                                <option th:each="p : ${products}" th:value="${p.productId}"
                                        th:text="${p.productId + ' - ' + p.productName}"></option>
                            </select>
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-6">
                                <label class="form-label">进价</label>
                                <input type="number" name="purchasePrice" class="form-control"
                                       step="0.01" min="0" required placeholder="0.00">
                            </div>
                            <div class="col-6">
                                <label class="form-label">数量</label>
                                <input type="number" name="quantity" class="form-control"
                                       min="1" required placeholder="1">
                            </div>
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-6">
                                <label class="form-label">买入日期</label>
                                <input type="date" name="purchaseDate" class="form-control" required
                                       th:value="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}">
                            </div>
                            <div class="col-6">
                                <label class="form-label">总金额</label>
                                <input type="number" name="totalAmount" class="form-control"
                                       step="0.01" min="0" placeholder="留空自动计算">
                                <div class="form-text">留空则自动计算（进价 × 数量）</div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">备注</label>
                            <input type="text" name="remark" class="form-control" maxlength="255">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-primary">保存</button>
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- ===== 卖出录入弹窗 ===== -->
    <div class="modal fade" id="saleModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <form th:action="@{/sale/save}" method="post">
                    <div class="modal-header">
                        <h5 class="modal-title">卖出录入</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">商品</label>
                            <select name="product.productId" id="tradeSaleProductSelect" class="form-select" required>
                                <option value="">-- 请选择商品 --</option>
                                <option th:each="p : ${products}" th:value="${p.productId}"
                                        th:text="${p.productId + ' - ' + p.productName}"></option>
                            </select>
                        </div>
                        <div class="mb-3" id="tradeSaleProductInfo" style="display:none;">
                            <div class="alert alert-info mb-0">
                                <div class="row">
                                    <div class="col-6">
                                        <small class="text-muted">当前库存</small>
                                        <div><strong id="tradeSaleStockDisplay">-</strong> 件</div>
                                    </div>
                                    <div class="col-6">
                                        <small class="text-muted">最近售价</small>
                                        <div><strong id="tradeSaleLatestPriceDisplay">-</strong> 元</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-6">
                                <label class="form-label">售价</label>
                                <input type="number" name="salePrice" id="tradeSalePriceInput" class="form-control"
                                       step="0.01" min="0" required placeholder="0.00">
                            </div>
                            <div class="col-6">
                                <label class="form-label">数量</label>
                                <input type="number" name="quantity" id="tradeSaleQuantityInput" class="form-control"
                                       min="1" required placeholder="1">
                                <div class="form-text" id="tradeSaleStockHint"></div>
                            </div>
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-6">
                                <label class="form-label">卖出日期</label>
                                <input type="date" name="saleDate" class="form-control" required
                                       th:value="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}">
                            </div>
                            <div class="col-6">
                                <label class="form-label">总金额</label>
                                <input type="number" name="totalAmount" class="form-control"
                                       step="0.01" min="0" placeholder="留空自动计算">
                                <div class="form-text">留空则自动计算（售价 × 数量）</div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">备注</label>
                            <input type="text" name="remark" class="form-control" maxlength="255">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-primary">保存</button>
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <th:block th:replace="~{common/header :: scripts}"></th:block>
    <script>
        var purchaseModal, saleModal;
        document.addEventListener('DOMContentLoaded', function() {
            purchaseModal = new bootstrap.Modal(document.getElementById('purchaseModal'));
            saleModal = new bootstrap.Modal(document.getElementById('saleModal'));

            // 卖出商品选择 → 库存/售价提示
            document.getElementById('tradeSaleProductSelect').addEventListener('change', function() {
                var productId = this.value;
                if (!productId) {
                    document.getElementById('tradeSaleProductInfo').style.display = 'none';
                    document.getElementById('tradeSalePriceInput').value = '';
                    document.getElementById('tradeSaleStockHint').textContent = '';
                    return;
                }
                fetch('/sale/product-info?productId=' + encodeURIComponent(productId))
                    .then(function(r) { return r.json(); })
                    .then(function(data) {
                        document.getElementById('tradeSaleProductInfo').style.display = 'block';
                        document.getElementById('tradeSaleStockDisplay').textContent = data.stock;
                        document.getElementById('tradeSaleLatestPriceDisplay').textContent =
                            Number(data.latestPrice).toFixed(2);
                        document.getElementById('tradeSalePriceInput').value = data.latestPrice;
                        document.getElementById('tradeSaleStockHint').textContent =
                            '当前库存 ' + data.stock + ' 件，请勿超出';
                    });
            });
        });

        function openPurchaseModal() { purchaseModal.show(); }
        function openSaleModal() { saleModal.show(); }
    </script>
</body>
</html>
