<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{common/header :: head}"></th:block>
</head>
<body>
    <th:block th:replace="~{common/header :: nav}"></th:block>

    <div class="container">
        <h3 class="mb-3">卖出汇总打印</h3>

        <form class="row g-3 mb-4" th:action="@{/sale/print}" method="get">
            <div class="col-md-2">
                <input type="date" name="startDate" class="form-control" th:value="${startDate}">
            </div>
            <div class="col-md-2">
                <input type="date" name="endDate" class="form-control" th:value="${endDate}">
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-primary">查询</button>
            </div>
            <div class="col-md-6 text-end">
                <button class="btn btn-outline-secondary" onclick="window.print()">打印本页</button>
            </div>
        </form>

        <table class="table table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>商品性质</th>
                    <th>卖出总数量</th>
                    <th>卖出总金额</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="row : ${summary}">
                    <td th:text="${row.categoryName}"></td>
                    <td th:text="${row.totalQuantity}"></td>
                    <td th:text="${#numbers.formatDecimal(row.totalAmount, 0, 'COMMA', 2, 'POINT')}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(summary)}">
                    <td colspan="3" class="text-center text-muted">暂无数据</td>
                </tr>
            </tbody>
            <tfoot th:if="${!#lists.isEmpty(summary)}" class="table-secondary">
                <tr>
                    <th>合计</th>
                    <th th:text="${#aggregates.sum(summary.![totalQuantity])}"></th>
                    <th th:text="${#numbers.formatDecimal(#aggregates.sum(summary.![totalAmount]), 0, 'COMMA', 2, 'POINT')}"></th>
                </tr>
            </tfoot>
        </table>
    </div>

    <th:block th:replace="~{common/header :: scripts}"></th:block>
</body>
</html>
