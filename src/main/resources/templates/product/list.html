<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{common/header :: head}"></th:block>
    <style>
        .modal.fade .modal-dialog {
            transform: scale(0.85);
            transition: transform 0.25s ease-out, opacity 0.25s ease-out;
            opacity: 0;
        }
        .modal.fade.show .modal-dialog {
            transform: scale(1);
            opacity: 1;
        }
    </style>
</head>
<body>
    <th:block th:replace="~{common/header :: nav}"></th:block>
    <th:block th:replace="~{common/header :: messages}"></th:block>

    <div class="container">
        <h3 class="mb-3">商品管理</h3>

        <form class="row g-3 mb-4" th:action="@{/product/list}" method="get">
            <div class="col-md-3">
                <input type="text" name="productId" class="form-control" placeholder="商品编号"
                       th:value="${productId}">
            </div>
            <div class="col-md-3">
                <input type="text" name="productName" class="form-control" placeholder="商品名称"
                       th:value="${productName}">
            </div>
            <div class="col-md-2">
                <select name="categoryId" class="form-select">
                    <option value="">全部性质</option>
                    <option th:each="c : ${categories}" th:value="${c.id}"
                            th:text="${c.categoryName}"
                            th:selected="${categoryId != null && categoryId == c.id}"></option>
                </select>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-primary">搜索</button>
                <a th:href="@{/product/list}" class="btn btn-outline-secondary">重置</a>
            </div>
            <div class="col-md-2 text-end">
                <button type="button" class="btn btn-success" onclick="openProductModal()">新增商品</button>
            </div>
        </form>

        <table class="table table-striped table-hover">
            <thead class="table-dark">
                <tr>
                    <th>商品编号</th>
                    <th>商品名称</th>
                    <th>商品性质</th>
                    <th>录入时间</th>
                    <th>状态</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="p : ${products}">
                    <td th:text="${p.productId}"></td>
                    <td th:text="${p.productName}"></td>
                    <td th:text="${p.category.categoryName}"></td>
                    <td th:text="${#temporals.format(p.createTime, 'yyyy-MM-dd HH:mm')}"></td>
                    <td>
                        <span th:if="${p.status == 1}" class="badge bg-success">在用</span>
                        <span th:unless="${p.status == 1}" class="badge bg-secondary">停用</span>
                    </td>
                    <td>
                        <button type="button" class="btn btn-sm btn-warning edit-btn"
                                th:attr="data-pid=${p.productId}">编辑</button>
                        <a th:if="${p.status == 1}"
                           th:href="@{/product/disable/{id}(id=${p.productId})}"
                           class="btn btn-sm btn-danger"
                           onclick="return confirm('确定停用该商品吗？')">停用</a>
                        <a th:unless="${p.status == 1}"
                           th:href="@{/product/enable/{id}(id=${p.productId})}"
                           class="btn btn-sm btn-success"
                           onclick="return confirm('确定启用该商品吗？')">启用</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(products)}">
                    <td colspan="6" class="text-center text-muted">暂无商品数据</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- ===== 商品弹窗 ===== -->
    <div class="modal fade" id="productModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <form th:action="@{/product/save}" method="post">
                    <div class="modal-header">
                        <h5 class="modal-title" id="productModalTitle">新增商品</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">商品编号</label>
                            <input type="text" name="productId" id="modalProductId" class="form-control"
                                   required maxlength="20">
                            <div id="productIdHelp" class="form-text text-muted" style="display:none">商品编号不可修改</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">商品名称</label>
                            <input type="text" name="productName" id="modalProductName" class="form-control"
                                   required maxlength="100">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">商品性质</label>
                            <select name="categoryId" id="modalCategoryId" class="form-select" required>
                                <option value="">-- 请选择 --</option>
                                <option th:each="c : ${categories}" th:value="${c.id}"
                                        th:text="${c.categoryName}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">状态</label>
                            <select name="status" id="modalStatus" class="form-select">
                                <option value="1">在用</option>
                                <option value="0">停用</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-primary">保存</button>
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <th:block th:replace="~{common/header :: scripts}"></th:block>
    <script>
        var productModal;
        document.addEventListener('DOMContentLoaded', function() {
            productModal = new bootstrap.Modal(document.getElementById('productModal'));
            // 编辑按钮委托
            document.querySelector('table').addEventListener('click', function(e) {
                var btn = e.target.closest('.edit-btn');
                if (btn) {
                    editProduct(btn.getAttribute('data-pid'));
                }
            });
        });

        function openProductModal() {
            document.getElementById('productModalTitle').textContent = '新增商品';
            document.getElementById('modalProductId').value = '';
            document.getElementById('modalProductId').readOnly = false;
            document.getElementById('productIdHelp').style.display = 'none';
            document.getElementById('modalProductName').value = '';
            document.getElementById('modalCategoryId').value = '';
            document.getElementById('modalStatus').value = '1';
            productModal.show();
        }

        function editProduct(productId) {
            fetch('/product/get/' + encodeURIComponent(productId))
                .then(function(r) { return r.json(); })
                .then(function(p) {
                    document.getElementById('productModalTitle').textContent = '编辑商品';
                    document.getElementById('modalProductId').value = p.productId;
                    document.getElementById('modalProductId').readOnly = true;
                    document.getElementById('productIdHelp').style.display = 'block';
                    document.getElementById('modalProductName').value = p.productName;
                    document.getElementById('modalCategoryId').value = p.categoryId;
                    document.getElementById('modalStatus').value = p.status;
                    productModal.show();
                });
        }
    </script>
</body>
</html>
