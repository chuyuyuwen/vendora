<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/header :: head}">
</head>
<body>
    <th:block th:replace="~{common/header :: nav}"></th:block>
    <th:block th:replace="~{common/header :: messages}"></th:block>

    <div class="container">
        <h3 class="mb-3">买入管理</h3>

        <form class="row g-3 mb-4" th:action="@{/purchase/list}" method="get">
            <div class="col-md-2">
                <select name="productId" class="form-select">
                    <option value="">全部商品</option>
                    <option th:each="p : ${products}" th:value="${p.productId}"
                            th:text="${p.productId + ' - ' + p.productName}"
                            th:selected="${productId != null && productId == p.productId}"></option>
                </select>
            </div>
            <div class="col-md-2">
                <input type="date" name="startDate" class="form-control" placeholder="开始日期"
                       th:value="${startDate}">
            </div>
            <div class="col-md-2">
                <input type="date" name="endDate" class="form-control" placeholder="结束日期"
                       th:value="${endDate}">
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-primary">查询</button>
                <a th:href="@{/purchase/list}" class="btn btn-outline-secondary">重置</a>
            </div>
            <div class="col-md-4 text-end">
                <button type="button" class="btn btn-success" onclick="openPurchaseModal()">买入录入</button>
                <a th:href="@{/purchase/print(startDate=${startDate}, endDate=${endDate})}"
                   class="btn btn-info">汇总打印</a>
            </div>
        </form>

        <table class="table table-striped table-hover">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>商品编号</th>
                    <th>商品名称</th>
                    <th>性质</th>
                    <th>进价</th>
                    <th>数量</th>
                    <th>总金额</th>
                    <th>买入日期</th>
                    <th>备注</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="pr : ${page.data}">
                    <td th:text="${pr.id}"></td>
                    <td th:text="${pr.product.productId}"></td>
                    <td th:text="${pr.product.productName}"></td>
                    <td th:text="${pr.product.category.categoryName}"></td>
                    <td th:text="${#numbers.formatDecimal(pr.purchasePrice, 0, 'COMMA', 2, 'POINT')}"></td>
                    <td th:text="${pr.quantity}"></td>
                    <td th:text="${#numbers.formatDecimal(pr.totalAmount, 0, 'COMMA', 2, 'POINT')}"></td>
                    <td th:text="${#temporals.format(pr.purchaseDate, 'yyyy-MM-dd')}"></td>
                    <td th:text="${pr.remark}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(page.data)}">
                    <td colspan="9" class="text-center text-muted">暂无买入记录</td>
                </tr>
            </tbody>
        </table>

        <div th:if="${page.totalPages > 0}" class="d-flex justify-content-between align-items-center">
            <span>共 <b th:text="${page.totalRecords}"></b> 条记录，第 <b th:text="${page.currentPage}"></b>/<b th:text="${page.totalPages}"></b> 页</span>
            <nav>
                <ul class="pagination mb-0">
                    <li class="page-item" th:classappend="${!page.hasPrevious} ? 'disabled'">
                        <a th:if="${page.hasPrevious}" class="page-link"
                           th:href="@{/purchase/list(productId=${productId}, startDate=${startDate}, endDate=${endDate}, pageNo=${page.previousPage}, pageSize=${page.pageSize})}">上一页</a>
                        <span th:unless="${page.hasPrevious}" class="page-link">上一页</span>
                    </li>
                    <li class="page-item" th:classappend="${!page.hasNext} ? 'disabled'">
                        <a th:if="${page.hasNext}" class="page-link"
                           th:href="@{/purchase/list(productId=${productId}, startDate=${startDate}, endDate=${endDate}, pageNo=${page.nextPage}, pageSize=${page.pageSize})}">下一页</a>
                        <span th:unless="${page.hasNext}" class="page-link">下一页</span>
                    </li>
                </ul>
            </nav>
        </div>
    </div>

    <!-- ===== 买入录入弹窗 ===== -->
    <div class="modal fade" id="purchaseModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <form th:action="@{/purchase/save}" method="post">
                    <div class="modal-header">
                        <h5 class="modal-title">买入录入</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">商品</label>
                            <select name="product.productId" class="form-select" required>
                                <option value="">-- 请选择商品 --</option>
                                <option th:each="p : ${products}" th:value="${p.productId}"
                                        th:text="${p.productId + ' - ' + p.productName}"></option>
                            </select>
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-6">
                                <label class="form-label">进价</label>
                                <input type="number" name="purchasePrice" class="form-control"
                                       step="0.01" min="0" required placeholder="0.00">
                            </div>
                            <div class="col-6">
                                <label class="form-label">数量</label>
                                <input type="number" name="quantity" class="form-control"
                                       min="1" required placeholder="1">
                            </div>
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-6">
                                <label class="form-label">买入日期</label>
                                <input type="date" name="purchaseDate" class="form-control" required
                                       th:value="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}">
                            </div>
                            <div class="col-6">
                                <label class="form-label">总金额</label>
                                <input type="number" name="totalAmount" class="form-control"
                                       step="0.01" min="0" placeholder="留空自动计算">
                                <div class="form-text">留空则自动计算（进价 × 数量）</div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">备注</label>
                            <input type="text" name="remark" class="form-control" maxlength="255">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-primary">保存</button>
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <th:block th:replace="~{common/header :: scripts}"></th:block>
    <script>
        var purchaseModal;
        document.addEventListener('DOMContentLoaded', function() {
            purchaseModal = new bootstrap.Modal(document.getElementById('purchaseModal'));
        });
        function openPurchaseModal() {
            purchaseModal.show();
        }
    </script>
</body>
</html>
