<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/header :: head}">
    <title>首页 - Vendora</title>
</head>
<body>
    <nav th:replace="~{common/header :: nav}"></nav>

    <div class="container">
        <div th:replace="~{common/header :: messages}"></div>

                <style>
            .stat-card {
                transition: transform 0.15s, box-shadow 0.15s;
                cursor: pointer;
            }
            .stat-card:hover {
                transform: translateY(-2px);
                box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.12) !important;
            }
        </style>
<h4 class="mb-4"><i class="fa-solid fa-chart-simple"></i> 数据概览</h4>

        <div class="row g-3 mb-4">
            <div class="col-md-3">
                <div class="card border-start border-primary border-4 stat-card shadow-sm h-100" onclick="location.href='/product/list'">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <p class="text-muted small mb-1">商品总数</p>
                                <h3 class="mb-0" th:text="${totalProducts}">0</h3>
                            </div>
                            <div class="bg-primary bg-opacity-10 p-3 rounded">
                                <i class="fa-solid fa-box text-primary fa-lg"></i>
                            </div>
                        </div>
                        <hr class="my-2">
                        <small class="text-success"><i class="fa-solid fa-circle"></i> 在用 <span th:text="${activeProducts}">0</span></small>
                        <small class="text-secondary ms-2"><i class="fa-solid fa-circle"></i> 停用 <span th:text="${disabledProducts}">0</span></small>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-start border-warning border-4 stat-card shadow-sm h-100" onclick="location.href='/inventory/list'">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <p class="text-muted small mb-1">低库存预警</p>
                                <h3 class="mb-0 text-warning" th:text="${lowStockCount}">0</h3>
                            </div>
                            <div class="bg-warning bg-opacity-10 p-3 rounded">
                                <i class="fa-solid fa-triangle-exclamation text-warning fa-lg"></i>
                            </div>
                        </div>
                        <hr class="my-2">
                        <small class="text-muted">库存低于 10 件的商品</small>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-start border-success border-4 stat-card shadow-sm h-100" onclick="location.href='/purchase/list'">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <p class="text-muted small mb-1">今日买入</p>
                                <h5 class="mb-0 text-success" th:text="'¥' + ${#numbers.formatDecimal(todayPurchasesAmount, 1, 'COMMA', 2, 'POINT')}">¥0.00</h5>
                            </div>
                            <div class="bg-success bg-opacity-10 p-3 rounded">
                                <i class="fa-solid fa-cart-plus text-success fa-lg"></i>
                            </div>
                        </div>
                        <hr class="my-2">
                        <small class="text-muted"><span th:text="${todayPurchasesCount}">0</span> 笔</small>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-start border-info border-4 stat-card shadow-sm h-100" onclick="location.href='/sale/list'">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <p class="text-muted small mb-1">今日卖出</p>
                                <h5 class="mb-0 text-info" th:text="'¥' + ${#numbers.formatDecimal(todaySalesAmount, 1, 'COMMA', 2, 'POINT')}">¥0.00</h5>
                            </div>
                            <div class="bg-info bg-opacity-10 p-3 rounded">
                                <i class="fa-solid fa-cash-register text-info fa-lg"></i>
                            </div>
                        </div>
                        <hr class="my-2">
                        <small class="text-muted"><span th:text="${todaySalesCount}">0</span> 笔</small>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-3">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-white">
                        <h6 class="mb-0"><i class="fa-solid fa-chart-pie text-primary"></i> 本月各性质销售额占比</h6>
                    </div>
                    <div class="card-body">
                        <div id="pieChart" style="height: 350px;"></div>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-white">
                        <h6 class="mb-0"><i class="fa-solid fa-chart-line text-success"></i> 近30天销售趋势</h6>
                    </div>
                    <div class="card-body">
                        <div id="lineChart" style="height: 350px;"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ===== 营业报表 ===== -->
        <hr class="my-4">
        <h4 class="mb-3"><i class="fa-solid fa-file-invoice"></i> 营业报表</h4>

        <form class="row g-3 mb-4" th:action="@{/}" method="get">
            <div class="col-md-2">
                <input type="date" name="startDate" class="form-control" th:value="${startDate}">
            </div>
            <div class="col-md-2">
                <input type="date" name="endDate" class="form-control" th:value="${endDate}">
            </div>
            <div class="col-md-2">
                <select name="categoryId" class="form-select">
                    <option value="">全部性质</option>
                    <option th:each="c : ${categories}" th:value="${c.id}"
                            th:text="${c.categoryName}"
                            th:selected="${categoryId != null && categoryId == c.id}"></option>
                </select>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-primary">查询</button>
                <a th:href="@{/}" class="btn btn-outline-secondary">重置</a>
            </div>
        </form>

        <div class="row g-3 mb-4">
            <div class="col-md-6">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-white">
                        <h6 class="mb-0"><i class="fa-solid fa-chart-line text-primary"></i> 营业额报表</h6>
                    </div>
                    <div class="card-body p-0">
                        <table class="table table-bordered mb-0">
                            <thead class="table-dark">
                                <tr>
                                    <th>商品性质</th>
                                    <th>销售总数量</th>
                                    <th>销售总金额</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="row : ${salesReport}">
                                    <td th:text="${row.categoryName}"></td>
                                    <td th:text="${row.totalQuantity}"></td>
                                    <td th:text="${#numbers.formatDecimal(row.totalAmount, 0, 'COMMA', 2, 'POINT')}"></td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(salesReport)}">
                                    <td colspan="3" class="text-center text-muted">暂无营业数据</td>
                                </tr>
                            </tbody>
                            <tfoot th:if="${!#lists.isEmpty(salesReport)}" class="table-secondary">
                                <tr>
                                    <th>合计</th>
                                    <th th:text="${salesTotalQty}"></th>
                                    <th th:text="${#numbers.formatDecimal(salesTotalAmt, 0, 'COMMA', 2, 'POINT')}"></th>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-white">
                        <h6 class="mb-0"><i class="fa-solid fa-chart-bar text-success"></i> 利润分析</h6>
                    </div>
                    <div class="card-body p-0">
                        <table class="table table-bordered mb-0">
                            <thead class="table-dark">
                                <tr>
                                    <th>商品性质</th>
                                    <th>销售数量</th>
                                    <th>销售额</th>
                                    <th>进货成本</th>
                                    <th>利润</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="row : ${profitReport}">
                                    <td th:text="${row.categoryName}"></td>
                                    <td th:text="${row.saleQuantity}"></td>
                                    <td th:text="${#numbers.formatDecimal(row.saleAmount, 0, 'COMMA', 2, 'POINT')}"></td>
                                    <td th:text="${#numbers.formatDecimal(row.purchaseAmount, 0, 'COMMA', 2, 'POINT')}"></td>
                                    <td>
                                        <span th:classappend="${row.profit.doubleValue() >= 0 ? 'text-success' : 'text-danger'}"
                                              th:text="${#numbers.formatDecimal(row.profit, 0, 'COMMA', 2, 'POINT')}"></span>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(profitReport)}">
                                    <td colspan="5" class="text-center text-muted">暂无数据</td>
                                </tr>
                            </tbody>
                            <tfoot th:if="${!#lists.isEmpty(profitReport)}" class="table-secondary">
                                <tr>
                                    <th>合计</th>
                                    <th th:text="${profitTotalQty}"></th>
                                    <th th:text="${#numbers.formatDecimal(profitTotalSale, 0, 'COMMA', 2, 'POINT')}"></th>
                                    <th th:text="${#numbers.formatDecimal(profitTotalPurchase, 0, 'COMMA', 2, 'POINT')}"></th>
                                    <th th:text="${#numbers.formatDecimal(profitTotalProfit, 0, 'COMMA', 2, 'POINT')}"></th>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:replace="~{common/header :: scripts}"></script>
    <script th:inline="javascript">
        // Compiled controller provides these as JSON strings
        var pieData = JSON.parse(/*[[${salesByCategoryJson}]]*/ '[]');
        var dailySales = JSON.parse(/*[[${dailySalesJson}]]*/ '[]');

        (function() {
            var chart = echarts.init(document.getElementById('pieChart'));
            if (pieData.length > 0) {
                chart.setOption({
                    tooltip: { trigger: 'item', formatter: '{b}: {c} ({d}%)' },
                    legend: { bottom: 0, textStyle: { fontSize: 12 } },
                    series: [{ type: 'pie', radius: ['40%', '65%'], center: ['50%', '45%'],
                        label: { formatter: '{b}', fontSize: 12 },
                        data: pieData.map(function(d) {
                            return { name: d.categoryName, value: d.totalAmount };
                        }) }]
                });
            } else {
                chart.setOption({ title: { text: '本月暂无数据', left: 'center', top: 'center',
                    textStyle: { color: '#999', fontSize: 14 } } });
            }
            window.addEventListener('resize', function() { chart.resize(); });
        })();

        (function() {
            var chart = echarts.init(document.getElementById('lineChart'));
            if (dailySales.length > 0) {
                chart.setOption({
                    tooltip: { trigger: 'axis' },
                    grid: { left: '8%', right: '4%', bottom: '12%', top: '8%' },
                    xAxis: { type: 'category', data: dailySales.map(function(d) { return d[0]; }),
                        axisLabel: { fontSize: 11 } },
                    yAxis: { type: 'value', axisLabel: { formatter: '{value}' } },
                    series: [{ type: 'line', data: dailySales.map(function(d) { return d[1]; }),
                        smooth: true, symbolSize: 6,
                        areaStyle: { color: new echarts.graphic.LinearGradient(0,0,0,1,
                            [{offset:0,color:'rgba(40,167,69,0.3)'},{offset:1,color:'rgba(40,167,69,0.02)'}]) } }]
                });
            } else {
                chart.setOption({ title: { text: '近30天暂无数据', left: 'center', top: 'center',
                    textStyle: { color: '#999', fontSize: 14 } } });
            }
            window.addEventListener('resize', function() { chart.resize(); });
        })();
    </script>
</body>
</html>
